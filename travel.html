<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wedding Travel</title>

<style>
/* ===== BASE ===== */
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #3B352F;
  color: #fff6da;
}

/* ===== NORMALIZED NAV ===== */
#site-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 1rem 1.5rem;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
}

.nav-links {
  display: flex;
  gap: 1.5rem;
}

#site-nav a {
  color: #fff6da;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.04em;
  position: relative;
}

#site-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -6px;
  margin: auto;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #e5c982, transparent);
  transition: width 0.25s ease;
}

#site-nav a:hover::after,
#site-nav a.active::after {
  width: 70%;
}

/* ===== MOBILE NAV ===== */
.menu-toggle {
  display: none;
  font-size: 2rem;
  cursor: pointer;
  color: #fff6da;
}

@media (max-width: 900px) {
  #site-nav {
    background: transparent;
    backdrop-filter: none;
  }

  .menu-toggle {
    display: block;
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
  }

  .nav-links {
    position: fixed;
    inset: 0;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  #site-nav.open .nav-links {
    opacity: 1;
    pointer-events: auto;
  }

  .nav-links a {
    font-size: 1.6rem;
  }
}

/* ===== TRAVEL HERO (NO IMAGE) ===== */
#travel-hero {
  height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 8rem;
  position: relative;
}

.travel-title {
  position: sticky;
  top: 2.5rem;
  z-index: 2;
  text-align: center;
}

.travel-title h1 {
  font-size: clamp(2.4rem, 6vw, 4rem);
  margin: 0;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.travel-title hr {
  border: none;
  height: 2px;
  width: 90px;
  margin: 1rem auto 0;
  background: linear-gradient(to right, transparent, #e5c982, transparent);
}

/* ===== TRAVEL CONTENT ===== */
#travel {
  padding: 2rem 1.5rem 5rem;
}

.section-blur {
  background: rgba(59,53,47,0.65);
  border-radius: 14px;
  padding: 2rem;
  max-width: 820px;
  margin: 0 auto;
  text-align: center;
  backdrop-filter: blur(6px);
}

.section-blur p {
  margin: 1rem 0;
}

.section-blur a {
  color: #fff6da;
  font-weight: 700;
  text-decoration: none;
  position: relative;
}

.section-blur a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -4px;
  margin: auto;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #e5c982, transparent);
  transition: width 0.25s ease;
}

.section-blur a:hover::after {
  width: 70%;
}

/* ===== MOBILE TAP TARGETS ===== */
@media (max-width: 900px) {
  .section-blur a {
    display: block;
    font-size: 1.4rem;
    margin: 0.75rem 0;
  }
}
</style>
</head>

<body>

<!-- NAV -->
<nav id="site-nav">
  <div class="menu-toggle" onclick="toggleNav()">☰</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="travel.html" class="active">Travel</a>
    <a href="schedule.html">Schedule</a>
    <a href="registry.html">Registry</a>
  </div>
</nav>

<!-- TRAVEL HERO -->
<section id="travel-hero">
  <div class="travel-title">
    <h1>Travel</h1>
    <hr />
  </div>
</section>

<!-- TRAVEL CONTENT -->
<section id="travel">
  <div class="section-blur">
    <p><a href="#">Recommended Hotels</a></p>
    <p><a href="#">Airport Information</a></p>
    <p><a href="#">Transportation & Shuttles</a></p>
    <p><a href="#">Things To Do</a></p>
  </div>
</section>

<!-- JS -->
<script>
function toggleNav() {
  document.getElementById("site-nav").classList.toggle("open");
}
</script>

</body>
</html>
