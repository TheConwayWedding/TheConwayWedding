  <style>
    /* ===== BASE ===== */
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Georgia", serif;
  color: #fdf9f3;
  background: #3B352F; /* Charcoal Grey */
  line-height: 1.6;
}

/* ===== NAV ===== */
nav {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.4rem;
  padding: 1rem 1.5rem;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  color: #fff8e7;
}
.nav-links {
  display: flex;
  gap: 1.4rem;
  justify-content: center;
  align-items: center;
}
nav a {
  color: #fff6da;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.04em;
  position: relative;
  padding: 0.25rem 0;
  transition: color 0.25s ease;
}
nav a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -6px;
  width: 0; height: 2px;
  margin: 0 auto;
  background: linear-gradient(90deg, transparent, #e5c982, transparent);
  transition: width 0.25s ease;
}
nav a:hover { color: #ffe9a9; }
nav a:hover::after, nav a.active::after { width: 70%; }
#nav-countdown { position: absolute; right: 4rem; font-weight: 700; color: #ffe9a9; }

/* ===== MOBILE NAV ===== */
.menu-toggle {
  display: none;
  font-size: 1.8rem;
  cursor: pointer;
  position: fixed;
  top: 0.9rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
}

@media (max-width: 900px) {
  nav {
    justify-content: center;
    padding: 0.9rem 1rem;
    background: transparent !important;
    backdrop-filter: none !important;
  }

  .menu-toggle {
    display: block;
    font-size: 1.8rem;
    cursor: pointer;
    position: fixed;
    top: 0.9rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
  }

  .nav-links {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding-top: 6rem;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-20px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 1050;
    gap: 2rem;
    align-items: center;
    justify-content: flex-start;
  }

  nav.open .nav-links {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .nav-links a {
    display: block;
    font-size: 1.5rem;
    color: #fff6da;
    text-decoration: none;
    font-weight: 700;
    position: relative;
    transition: color 0.25s ease;
  }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    width: 0; height: 2px;
    margin: 0 auto;
    background: linear-gradient(90deg, transparent, #e5c982, transparent);
    transition: width 0.25s ease;
  }

  .nav-links a:hover::after, .nav-links a:hover { color: #ffe9a9; width: 70%; }

  #nav-countdown { display: none !important; }
}


/* ===== HEADER ===== */
header#home {
  position: relative; height: 100vh; padding:0; text-align: center;
  color: #fff6da; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
}
.header-slideshow {
  position: absolute; inset:0; width:100%; height:100%; z-index:0;
}
.header-slideshow img {
  position: absolute; top:50%; left:50%; transform:translate(-50%, -50%);
  width:auto; height:100%; object-fit:cover; object-position:center;
  opacity:0; transition: opacity 1.5s ease-in-out; will-change: opacity;
}
.header-slideshow img.active { opacity:1; }
.header-content { position: relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-shadow:0 2px 6px rgba(0,0,0,0.5); padding:0 1rem; }
.hero-title { display:flex; flex-direction: column; align-items:center; font-size:2.4rem; line-height:1.2; text-align:center; }
.hero-title span { display:block; }
.hero-lastname { margin-top:0.35rem; font-size:2rem; color:#fff6da; }
#countdown { margin-top:1rem; font-size:1.25rem; color:#ffe9a9; }

/* ===== SECTIONS ===== */
section { padding: 4.5rem 1.5rem; text-align:center; }
section h2 { color:#fff6da; font-size:2.2rem; letter-spacing:1px; text-transform:uppercase; margin:0 0 0.6rem; }
hr.divider { border:none; height:2px; width:80px; margin:1rem auto 1.6rem; background: linear-gradient(to right, transparent, #e5c982, transparent); }
section p { color:#fdf9f3; font-size:1.05rem; line-height:1.7; max-width:800px; margin:0 auto; white-space:pre-line; }

/* ===== STORY ===== */
#story { background: rgba(0,0,0,0.28); backdrop-filter: blur(4px); }
.story-content { max-width:900px; margin:0 auto; text-align:left; background: rgba(59,53,47,0.62); border-radius:14px; padding:1.6rem; }
#story p { text-indent:1.5em; margin-bottom:1.2rem; line-height:1.8; }

/* ===== PLACE ===== */
#place { position: relative; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0; }
#place video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; filter:brightness(0.55); }
.place-content { position:relative; z-index:1; background: rgba(59,53,47,0.72); padding:2rem; border-radius:14px; max-width:820px; margin:2rem; text-align:center; backdrop-filter: blur(6px); }
.place-content h2 { margin-top:0; color:#fff6da; font-size:2.4rem; }
.place-content p { margin:0; }

/* ===== PARTY ===== */
#party { background: rgba(0,0,0,0.22); backdrop-filter: blur(3px); }
.party-highlight { display:flex; justify-content:center; gap:3rem; margin-bottom:2rem; flex-wrap:wrap; }
.party-grid { display:flex; justify-content:space-between; gap:3rem; max-width:1200px; margin:0 auto; flex-wrap:wrap; }
.party-side { flex:1 1 45%; min-width:260px; }
.side-title { text-align:center; margin-bottom:1rem; color:#fff6da; font-size:1.2rem; font-weight:700; }
.members-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; justify-items:center; }
.party-member { background: rgba(59,53,47,0.62); border-radius:12px; padding:1rem; text-align:center; margin-bottom:0; }
.party-member img { border-radius:8px; width:140px; height:140px; object-fit:cover; display:block; margin:0 auto 0.5rem; border:4px solid rgba(230,200,130,0.12); }
.party-member h3 { margin:0.25rem 0; color:#ffe9a9; font-size:1.05rem; }
.party-member .role { color:#fff8e7; font-size:0.95rem; margin-bottom:0.35rem; }
.party-member .bio { color:#fdf9f3; font-size:0.95rem; line-height:1.45; margin:0; }
.party-grid > .party-side:first-child .members-grid > .party-member:nth-child(7) {
  grid-column: 1 / -1;
  justify-self: center;
}



/* ===== GALLERY ===== */
.photo-grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); max-width:1000px; margin:1.2rem auto 0; }
.photo-grid img { width:100%; height:160px; object-fit:cover; border-radius:10px; }

/* ===== BUTTONS ===== */
button, a.button { background-color:#c7a96b; color:#3B352F; border:none; padding:0.72rem 1.25rem; border-radius:8px; font-family:"Georgia",serif; font-size:1rem; letter-spacing:0.02em; cursor:pointer; transition:all 0.25s ease; text-decoration:none; display:inline-block; }
button:hover, a.button:hover { background-color:#e5c982; color:#2c261f; transform:translateY(-3px); box-shadow:0 6px 18px rgba(199,169,107,0.25); }

/* ===== FOOTER ===== */
footer { background: rgba(0,0,0,0.5); color:#fff8e7; padding:2rem 1rem; text-align:center; font-size:0.95rem; letter-spacing:0.04em; margin-top:2rem; backdrop-filter:blur(4px);}
footer a { color:#ffe9a9; text-decoration:none; font-weight:700; }
footer a:hover { color:#fff6da; text-decoration:underline; }

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  header#home { padding:6.5rem 1rem 4.5rem; }
  .place-content, .section-box { margin:1rem; padding:1.2rem; }
  .party-member img { width:120px; height:120px; }
}
    @media (max-width: 700px) {
  .party-highlight {
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }
  .party-highlight .party-member {
    width: 85%;
    max-width: 280px;
  }
}

.party-highlight .party-member {
  width: 240px;              /* lock identical width */

  border-radius: 10px;

  margin-bottom: 0.75rem;
}
    /* Photo grid for mobile and desktop */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  max-width: 1000px;
  margin: 1.2rem auto 0;
}

.photo-grid img {
  width: 100%;

}

/* Mobile-specific grid */
@media (max-width: 768px) {
  .photo-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
  }

  .photo-grid img {
    height: 120px;
  }
}

/* Lightbox styles */
.lightbox {
  display: none;
  position: fixed;
  z-index: 2000;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 85%;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.lightbox.show {
  display: flex;
}

.lightbox:after {
  content: "✕";
  position: absolute;
  top: 20px;
  right: 25px;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
}
