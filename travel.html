<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel — Da'Quan & Savannah</title>

  <style>
/* ===== BASE ===== */
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Georgia", serif;
  color: #fdf9f3;
  background: #3B352F;
  line-height: 1.6;
}

/* Lock scroll when mobile nav open */
body.nav-open {
  overflow: hidden;
}

/* ===== NAV ===== */
nav {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.4rem;
  padding: 1rem 1.5rem;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
}

.nav-links {
  display: flex;
  gap: 1.4rem;
  justify-content: center;
  align-items: center;
}

nav a {
  color: #fff6da;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.04em;
  position: relative;
  padding: 0.25rem 0;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -6px;
  width: 0;
  height: 2px;
  margin: 0 auto;
  background: linear-gradient(90deg, transparent, #e5c982, transparent);
  transition: width 0.25s ease;
}

nav a:hover::after,
nav a.active::after {
  width: 70%;
}

#nav-countdown {
  position: absolute;
  right: 4rem;
  font-weight: 700;
  color: #ffe9a9;
}

/* ===== MOBILE NAV ===== */
.menu-toggle {
  display: none;
  font-size: 1.8rem;
  cursor: pointer;
  position: fixed;
  top: 0.9rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
}

@media (max-width: 900px) {
  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 6rem 0 2rem;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    transform: translateY(-100%);
    transition: transform 0.4s ease;
    z-index: 1050;

    display: flex;
    flex-direction: column;
    gap: 2rem;
    align-items: center;
  }

  nav.open .nav-links {
    transform: translateY(0);
  }

  nav.open {
    background: rgba(0,0,0,0.6);
  }

  #nav-countdown {
    display: none;
  }
}

/* ===== PAGE TITLE ===== */
#page-title {
  padding-top: 9rem;
  padding-bottom: 2rem;
  text-align: center;
}

#page-title h1 {
  font-size: 2.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  color: #fff6da;
}

#page-title p {
  font-style: italic;
  color: #ffe9a9;
  margin: 0;
}

/* ===== SECTIONS ===== */
section {
  padding: 3rem 1.5rem;
  text-align: center;
}

section h2 {
  color: #fff6da;
  font-size: 2.2rem;
  text-transform: uppercase;
}

hr.divider {
  border: none;
  height: 2px;
  width: 80px;
  margin: 1rem auto 1.6rem;
  background: linear-gradient(to right, transparent, #e5c982, transparent);
}

.section-blur {
  background: rgba(59,53,47,0.62);
  border-radius: 12px;
  padding: 1.5rem 2rem;
  max-width: 820px;
  margin: 0 auto;
  backdrop-filter: blur(6px);
}

.section-blur a {
  display: block;
  color: #fff6da;
  font-weight: 700;
  text-decoration: none;
  margin: 0.75rem 0;
  position: relative;
}

.section-blur a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -4px;
  width: 0;
  height: 2px;
  margin: 0 auto;
  background: linear-gradient(90deg, transparent, #e5c982, transparent);
  transition: width 0.25s ease;
}

.section-blur a:hover::after {
  width: 70%;
}

/* ===== FOOTER ===== */
footer {
  background: rgba(0,0,0,0.5);
  color: #fff8e7;
  padding: 2rem 1rem;
  text-align: center;
  font-size: 0.95rem;
  margin-top: 3rem;
}
  </style>
</head>

<body>

<nav>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="https://www.amazon.com/wedding/share/Savannah-and-DaQuan" target="_blank">Registry</a>
    <a href="gallery.html">Gallery</a>
    <a href="video.html">Video</a>
    <a href="travel.html" class="active">Travel</a>
    <a href="FAQs.html">FAQs</a>
  </div>

  <div id="nav-countdown"></div>
  <div class="menu-toggle" id="menu-toggle">☰</div>
</nav>

<section id="page-title">
  <h1>Travel</h1>
  <p>Where to stay for our wedding weekend</p>
</section>

<section id="travel">
  <h2>Travel</h2>
  <hr class="divider" />

  <div class="section-blur">
    <a href="https://www.trailbornrockymountains.com" target="_blank">
      Trailborn Rocky Mountains (Recommended Stay)
    </a>
    <a href="https://www.theestesparkresort.com" target="_blank">
      The Estes Park Resort (Luxury Alternative)
    </a>
    <a href="https://www.ihg.com/holidayinn/hotels/us/en/estes-park/denep/hoteldetail" target="_blank">
      Holiday Inn (Cost-Friendly Alternative)
    </a>
  </div>
</section>

<footer>
  <p>With love — Da'Quan & Savannah • August 26, 2026</p>
</footer>

<script>
// ===== COUNTDOWN =====
const weddingDate = new Date("August 26, 2026 00:00:00").getTime();
const navCountdownEl = document.getElementById("nav-countdown");

function updateCountdown() {
  const now = new Date().getTime();
  const distance = weddingDate - now;

  if (distance < 0) {
    navCountdownEl.innerHTML = "Wedding Day!";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  navCountdownEl.innerHTML = `${days} days to go`;
}
setInterval(updateCountdown, 60000);
updateCountdown();

// ===== MOBILE NAV =====
const menuToggle = document.getElementById('menu-toggle');
const nav = document.querySelector('nav');

menuToggle.addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  document.body.classList.toggle('nav-open', open);
  menuToggle.textContent = open ? '✕' : '☰';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && nav.classList.contains('open')) {
    nav.classList.remove('open');
    document.body.classList.remove('nav-open');
    menuToggle.textContent = '☰';
  }
});
</script>

</body>
</html>
